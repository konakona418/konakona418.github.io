<!DOCTYPE HTML><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="嚯嚯嚯，夸张哦"><title>搜索</title><meta property="og:title" content="搜索"><meta property="og:type" content="website"><meta property="og:site_name" content="李萌的博客"><meta property="og:description" content="嚯嚯嚯，夸张哦"><meta property="og:url" content="https://lizi.moe/search/"><link rel="stylesheet" href="/style.css"></head><body><header class="site-header"><nav><a class="site-name" href="/">李萌的博客</a><a href="/about/">关于</a><a href="/tags/">标签</a><a href="/archive/">归档</a><a href="/search/">搜索</a><a href="/rss/">RSS</a></nav></header><main><input class="search-input" type="search" placeholder="Search…" autofocus><ul class="post-list" id="search-results"></ul><script>document.addEventListener("DOMContentLoaded", function () {
 if (window.buroguSearch) {
  window.buroguSearch({ url: "/search.json" });
  return;
 }
 var input = document.querySelector(".search-input");
 var list = document.getElementById("search-results");
 function highlight(node, text, q) {
  var lower = text.toLowerCase();
  var i = lower.indexOf(q);
  if (i === -1) { node.textContent = text; return; }
  if (i > 0) { node.appendChild(document.createTextNode(text.slice(0, i))); }
  var mark = document.createElement("mark");
  mark.textContent = text.slice(i, i + q.length);
  node.appendChild(mark);
  var after = text.slice(i + q.length);
  if (after) { node.appendChild(document.createTextNode(after)); }
 }
 function snippetAround(text, q) {
  var lower = text.toLowerCase();
  var i = lower.indexOf(q);
  if (i === -1) { return text.slice(0, 80); }
  var start = Math.max(0, i - 20);
  var end = Math.min(text.length, i + q.length + 60);
  return (start > 0 ? "…" : "") + text.slice(start, end);
 }
 fetch("/search.json").then(function (r) { return r.json(); }).then(function (index) {
  input.addEventListener("input", function () {
   var q = input.value.trim().toLowerCase();
   while (list.firstChild) { list.removeChild(list.firstChild); }
   if (!q) { return; }
   index.forEach(function (entry) {
    var hay = (entry.title + " " + entry.text).toLowerCase();
    if (hay.indexOf(q) === -1) { return; }
    var li = document.createElement("li");
    li.className = "post-item";
    var a = document.createElement("a");
    a.href = entry.url;
    highlight(a, entry.title, q);
    li.appendChild(a);
    var p = document.createElement("p");
    p.className = "post-desc";
    if (entry.date) { p.appendChild(document.createTextNode(entry.date + " — ")); }
    highlight(p, snippetAround(entry.text, q), q);
    li.appendChild(p);
    list.appendChild(li);
   });
  });
 });
});
</script></main><footer class="site-footer"><p>© moe li · Generated with Burogu</p></footer></body></html>
