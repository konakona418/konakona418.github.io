 var stored = localStorage.getItem("burogu-theme");
 var button = document.createElement("button");
 button.className = "theme-toggle";
 button.type = "button";
 button.setAttribute("aria-label", "Toggle dark mode");
 var svgAttrs = 'xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
 var moonSvg = '<svg ' + svgAttrs + '><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
 var sunSvg = '<svg ' + svgAttrs + '><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
 function apply(theme) {
  if (theme === "dark" || theme === "light") {
   document.documentElement.setAttribute("data-theme", theme);
  } else {
   document.documentElement.removeAttribute("data-theme");
  }
  button.innerHTML = theme === "dark" ? sunSvg : moonSvg;
 }
 apply(stored);
 button.addEventListener("click", function () {
  var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  localStorage.setItem("burogu-theme", next);

 });

</script><link rel="stylesheet" href="/style.css"></head><body><header class="site-header"><nav><a class="site-name" href="/">李萌的博客</a><a href="/about/">关于</a><a href="/tags/">标签</a><a href="/archive/">归档</a><a href="/search/">搜索</a><a href="/rss/">RSS</a></nav></header><main><input class="search-input" type="search" placeholder="搜索…" autofocus><ul class="post-list" id="search-results"></ul><script>document.addEventListener("DOMContentLoaded", function () {
 if (window.buroguSearch) {
  window.buroguSearch({ url: "/search.json" });
  return;
 }
 var input = document.querySelector(".search-input");
 var list = document.getElementById("search-results");
 function highlight(node, text, q) {
  var lower = text.toLowerCase();
  var i = lower.indexOf(q);
  if (i === -1) { node.textContent = text; return; }
  if (i > 0) { node.appendChild(document.createTextNode(text.slice(0, i))); }
  var mark = document.createElement("mark");
  mark.textContent = text.slice(i, i + q.length);
  node.appendChild(mark);
  var after = text.slice(i + q.length);
  if (after) { node.appendChild(document.createTextNode(after)); }
 }
 function snippetAround(text, q) {
  var lower = text.toLowerCase();
  var i = lower.indexOf(q);
  if (i === -1) { return text.slice(0, 80); }
  var start = Math.max(0, i - 20);
  var end = Math.min(text.length, i + q.length + 60);
  return (start > 0 ? "…" : "") + text.slice(start, end);
 }
 fetch("/search.json").then(function (r) { return r.json(); }).then(function (index) {
  input.addEventListener("input", function () {
   var q = input.value.trim().toLowerCase();
   while (list.firstChild) { list.removeChild(list.firstChild); }
   if (!q) { return; }
   index.forEach(function (entry) {
    var hay = (entry.title + " " + entry.text).toLowerCase();
    if (hay.indexOf(q) === -1) { return; }
    var li = document.createElement("li");
    li.className = "post-item";
    if (entry.date) {
     var time = document.createElement("time");
     time.className = "post-date";
     time.textContent = entry.date;
     li.appendChild(time);
    }
    var a = document.createElement("a");
    a.href = entry.url;
    highlight(a, entry.title, q);
    li.appendChild(a);
    var p = document.createElement("p");
    p.className = "post-desc";
    highlight(p, snippetAround(entry.text, q), q);
    li.appendChild(p);
    list.appendChild(li);
   });
  });
 });
});
</script></main><footer class="site-footer"><p>© moe li · Generated with Burogu</p></footer></body></html>
